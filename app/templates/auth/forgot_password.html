{% extends "base.html" %} {% block title %}Forgot Password - Resume Analyzer{%
endblock %} {% block content %}
<div class="container mt-5 pt-5">
  <div class="row justify-content-center">
    <div class="col-md-5">
      <div class="card shadow-lg border-0">
        <div class="card-body p-5">
          <div class="text-center mb-4">
            <i class="bi bi-key display-4 text-warning"></i>
            <h3 class="mt-2">Forgot Password?</h3>
            <p class="text-muted">Enter your email to receive a reset link</p>
          </div>

          <form method="POST" action="{{ url_for('auth.forgot_password') }}">
            <div class="mb-4">
              <label for="email" class="form-label">Email Address</label>
              <div class="input-group">
                <span class="input-group-text"
                  ><i class="bi bi-envelope"></i
                ></span>
                <input
                  type="email"
                  class="form-control"
                  id="email"
                  name="email"
                  placeholder="Enter your registered email"
                  required
                />
              </div>
            </div>

            <button type="submit" class="btn btn-warning w-100 py-2">
              <i class="bi bi-send me-2"></i>Send Reset Link
            </button>
          </form>

          <hr class="my-4" />

          <div class="text-center">
            <p class="mb-0">
              Remember your password?
              <a href="{{ url_for('auth.login') }}" class="text-primary fw-bold"
                >Sign In</a
              >
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
